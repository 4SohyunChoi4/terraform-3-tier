name: terraform

on:
  pull_request:
    paths: ["**.tf", "**.tfvars"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate
        run: |
          for d in envs/dev envs/prod; do
            (cd "$d" && terraform init -backend=false && terraform validate)
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: tflint --recursive
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true

  plan:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: d6-env/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::329544694167:role/tf-lab-github-plan
          aws-region: ap-northeast-2
      - name: plan
        id: plan
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false > plan.txt 2>&1 || true
          cat plan.txt
      - name: comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('d6-env/envs/dev/plan.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## terraform plan (dev)\n```\n' + plan.slice(-60000) + '\n```'
            });